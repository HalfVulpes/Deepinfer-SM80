name: patch-stack

# Validates the two-patch stack without any GPU:
#
#   * both patches apply to the documented vLLM base commit
#   * after patching, the tree contains the modules the patches promise
#     (including ppv_share.py, the file missing in issue #2)
#   * the patched tree is byte-identical to the published drop-in directory
#
# This is the regression that issues #1 and #2 actually reported: the code was
# fine, but the installation path was not reproducible.

on:
  push:
  pull_request:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone the vLLM base commit
        env:
          VLLM_BASE: 79a7108d9aea27ddab99ce1779290d300b17fc23
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/vllm-project/vllm.git /tmp/vllm
          git -C /tmp/vllm fetch --depth 1 origin "${VLLM_BASE}"
          git -C /tmp/vllm checkout "${VLLM_BASE}"

      - name: Dry-run the patch stack
        run: bash scripts/apply_patches.sh --vllm-dir /tmp/vllm --dry-run

      - name: Apply both patches and check the promised modules
        run: bash scripts/apply_patches.sh --vllm-dir /tmp/vllm

      - name: Patched tree must equal the published drop-ins
        run: python3 scripts/check_dropin_sync.py --vllm-dir /tmp/vllm --quiet
