name: tests

# GPU-free unit tests under tests/. They need only a CPU build of PyTorch: the
# vLLM and Triton imports of the module under test are stubbed, so no vLLM build
# is involved. test_topk_source_reuse.py guards the per-layer top-k reuse rule
# (the stale-memo bug fixed in e2b585f, see docs/KNOWN_ISSUES.md).

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.13.0

      - name: Run the tests
        run: python -m unittest discover -s tests -v
